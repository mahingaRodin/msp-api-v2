apiVersion: apps/v1
kind: Deployment
metadata:
  name: msp-backend
  namespace: msp
  labels:
    app.kubernetes.io/name: msp-backend
    app.kubernetes.io/part-of: msp-api
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: msp-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: msp-backend
        app.kubernetes.io/part-of: msp-api
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z msp-postgres 5432; do echo "waiting for postgres"; sleep 2; done
              until nc -z redis-service 6379; do echo "waiting for redis"; sleep 2; done
      containers:
        - name: msp-backend
          image: msp-api:placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: msp-backend-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: msp-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: msp-db-secret
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: msp-backend-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 5000
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 5000
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
