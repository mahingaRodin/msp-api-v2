name: Staging — tests and load gate

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:
    inputs:
      run_soak:
        description: Also run 15m catalog soak (manual pre-release)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests (service layer + Redis; WebMvc slice fix tracked separately)
        run: mvn -B test -Dtest='com.msp.impls.**.*Test,com.msp.configs.RedisSerializationTest'

  flyway-integration:
    name: Flyway integration (optional)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Flyway migration integration
        run: mvn -B test -Dtest=FlywayMigrationIntegrationTest
        env:
          FLYWAY_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/msp_flyway_test
          FLYWAY_TEST_USERNAME: postgres
          FLYWAY_TEST_PASSWORD: 12345

  load-gate:
    name: Load gate (k6 + prod-like stack)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres, Redis, and API (768m / 0.5 CPU)
        working-directory: load-test
        run: |
          docker compose -f docker-compose.ci.yml up -d --build --wait
          curl -sf http://127.0.0.1:5000/actuator/health
          echo "API is healthy"

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Smoke + moderate concurrency (CI SLO gate)
        working-directory: load-test/k6
        run: |
          k6 run -e BASE_URL=http://127.0.0.1:5000 ci-smoke.js

      - name: Production-style catalog ramp (50 VU)
        working-directory: load-test/k6
        run: |
          k6 run -e BASE_URL=http://127.0.0.1:5000 -e PROFILE=ramp prod-catalog.js

      - name: Production-style catalog soak (15m, manual)
        if: github.event_name == 'workflow_dispatch' && inputs.run_soak
        working-directory: load-test/k6
        run: |
          k6 run -e BASE_URL=http://127.0.0.1:5000 -e PROFILE=soak prod-catalog.js

      - name: Upload load summary
        if: always()
        run: |
          mkdir -p load-test/results
          date -u +"%Y-%m-%dT%H:%M:%SZ CI load gate finished (see job logs for k6 metrics)" \
            > load-test/results/latest-ci-run.txt

      - name: Tear down CI stack
        if: always()
        working-directory: load-test
        run: docker compose -f docker-compose.ci.yml down -v

  staging-summary:
    name: Staging gate passed
    runs-on: ubuntu-latest
    needs: [unit-tests, flyway-integration, load-gate]
    if: success()
    steps:
      - run: |
          echo "All staging gates passed."
          echo "Merge staging -> main to deploy (main runs deploy.yml only)."
